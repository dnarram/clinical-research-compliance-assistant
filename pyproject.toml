[project]
name = "clinical-research-compliance-assistant"
version = "0.1.0"
description = "RAG agent on ICH GCP and pharmacovigilance guidelines — Gemini + ChromaDB + LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",
    "langchain-core>=1.7,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-chroma>=1.1,<2",
    "chromadb>=1.5,<2",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6,<8",
    "python-dotenv>=1.1",
    "pyyaml>=6",
    "streamlit>=1.50",
    # chromadb needs sqlite >= 3.35; Streamlit Cloud's Linux image may ship an older one.
    "pysqlite3-binary>=0.5; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=4.0",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
    "grandalf>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_assistant"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PTH",      # prefer pathlib
    "RUF",
]
ignore = [
    # Long f-strings in progress/report output are clearer left alone.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Entry-point wrappers import from src before argparse runs; that is intentional.
"scripts/*.py" = ["E402"]
# app.py must move Streamlit secrets into the environment before importing the package.
"app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    # google-genai ships docstrings with invalid escape sequences; not ours to fix.
    "ignore::SyntaxWarning",
]
